<!doctype html>

  <head>

    <title>CHEPE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <video class="background-video" autoplay muted loop playsinline>
      <source src="assets/background.mp4?v=20260531-1801" type="video/mp4" />
    </video>

    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="CHEPE home">
          <span class="brand-mark">
            <img src="assets/head_logo.png" alt="" />
          </span>
          <span>$CHEPE</span>

        <nav class="topnav" aria-label="Main navigation">
          <a href="#lore">About</a>
          <a href="#stickers">Stickers</a>
          <a href="https://t.me/dtrade?start=26STWuUm8m_EQBxjNmwpTzSMDI6-_X2ad78fwnvZXxdHSzNyx_0wl5n24S5" target="_blank" rel="noreferrer">
            Buy <span>DTrade</span>
          </a>
          <a href="#chart">Chart</a>
          <a href="#cheperator-bot">Cheperator Bot</a>
        </nav>

        <a class="connect-button" href="https://t.me/chepechat" target="_blank" rel="noreferrer">
          Connect ↗
        </a>
      </header>

      <section class="hero" id="about" aria-label="CHEPE hero">
        <p class="pill">✦ The mistake that becomes a cult on TON</p>

        <img class="hero-logo" src="assets/logo.svg" alt="CHEPE" />

        <nav class="actions" aria-label="CHEPE links">
          <a class="button button-dark" href="https://dexscreener.com/ton/eqdhqtk_seftl95gj3ciukmkwnoog_i-bdv9jzrbovb7rshe" target="_blank" rel="noreferrer">
            Buy $CHEPE ↗
          </a>
          <a class="button button-accent" href="https://t.me/chepechat" target="_blank" rel="noreferrer">
            Join Telegram ↗
          </a>
          <a class="button button-dark" href="https://x.com/chepeonton" target="_blank" rel="noreferrer">
            X Twitter ↗
          </a>
          <a class="button button-dark" href="https://dexscreener.com/ton/eqdhqtk_seftl95gj3ciukmkwnoog_i-bdv9jzrbovb7rshe" target="_blank" rel="noreferrer">
            Dex Screener ↗
          </a>
        </nav>

        <section class="contract-card" aria-label="TON contract">
          <p>TON Contract</p>
          <button class="contract-value" type="button" data-contract="EQBxjNmwpTzSMDI6-_X2ad78fwnvZXxdHSzNyx_0wl5n24S5">
            <span>EQBxjNmwpTzSMDI6-_X2ad78fwnvZXxdHSzNyx_0wl5n24S5</span>

          </button>

        <section class="chart-card lore-card" id="lore" aria-label="CHEPE lore teaser">
          <h2>Lore</h2>
          <div class="video-frame">
            <video poster="assets/video_cover.jpg" preload="metadata" playsinline>
              <source src="assets/teaser.mp4" type="video/mp4" />
            </video>
            <button class="video-play-button" type="button" aria-label="Play lore video">
              <span></span>
            </button>
          </div>
        </section>

        <section class="chart-card bot-card" id="cheperator-bot" aria-label="CHEPE Cheperator Bot">
          <h2>Cheperator Bot</h2>
        </section>

        <section class="chart-card" id="chart" aria-label="CHEPE live chart">
          <h2>Live Chart</h2>
          <div class="chart-frame">
            <iframe
              title="CHEPE live chart on Dex Screener"
              src="https://dexscreener.com/ton/eqdhqtk_seftl95gj3ciukmkwnoog_i-bdv9jzrbovb7rshe?embed=1&theme=dark&trades=0&info=0"
              loading="lazy"
            ></iframe>
          </div>
        </section>

        <section class="chart-card fan-art-card" aria-label="CHEPE community fan art">
          <div class="section-heading">
            <h2>Community Fan Art</h2>
            <a href="https://x.com/chepeonton" target="_blank" rel="noreferrer">By Cheperator</a>
          </div>
          <div class="fan-art-grid" aria-label="Random CHEPE meme gallery">
            <div class="fan-art-tile"><img src="assets/memes/meme_1.jpg" alt="CHEPE community art" /></div>
            <div class="fan-art-tile"><img src="assets/memes/meme_2.jpg" alt="CHEPE community art" /></div>
            <div class="fan-art-tile"><img src="assets/memes/meme_3.jpg" alt="CHEPE community art" /></div>
            <div class="fan-art-tile"><img src="assets/memes/meme_4.jpg" alt="CHEPE community art" /></div>
            <div class="fan-art-tile"><img src="assets/memes/meme_5.jpg" alt="CHEPE community art" /></div>
            <div class="fan-art-tile"><img src="assets/memes/meme_6.jpg" alt="CHEPE community art" /></div>
          </div>
        </section>

        <section class="chart-card stickers-card" id="stickers" aria-label="CHEPE Telegram stickers">
          <h2>Telegram Stickers</h2>
          <div class="stickers-frame">
            <img src="assets/stickers.jpg" alt="CHEPE Telegram stickers" />
          </div>
        </section>
      </section>

    <script src="script.js?v=20260531-1845"></script>
